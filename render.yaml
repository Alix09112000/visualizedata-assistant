services:
  # 1. Site vitrine — Static Site (gratuit)
  - type: web
    name: visualizedata-site
    runtime: static
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  # 2. Assistant IA — Web Service Python (gratuit)
  - type: web
    name: visualizedata-assistant
    runtime: python
    rootDir: app
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
